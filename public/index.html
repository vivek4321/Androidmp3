<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text to MP3 Converter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
            min-height: 120px;
            transition: border-color 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .char-count {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .convert-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .convert-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .convert-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .clear-btn {
            background: #f0f0f0;
            color: #333;
        }

        .clear-btn:hover {
            background: #e0e0e0;
        }

        .result-section {
            display: none;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid #e0e0e0;
        }

        .result-section.show {
            display: block;
        }

        .audio-player {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 5px;
            margin-bottom: 15px;
        }

        .audio-player audio {
            width: 100%;
            margin-bottom: 10px;
        }

        .player-info {
            font-size: 12px;
            color: #666;
        }

        .download-btn {
            background: #4caf50;
            color: white;
            width: 100%;
            padding: 12px;
        }

        .download-btn:hover {
            background: #45a049;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #ffebee;
            color: #c62828;
            padding: 12px;
            border-radius: 5px;
            margin-top: 10px;
            display: none;
        }

        .error.show {
            display: block;
        }

        .success {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 12px;
            border-radius: 5px;
            margin-top: 10px;
            display: none;
        }

        .success.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎵 Text to MP3 Converter</h1>
        <p class="subtitle">Convert your text into high-quality MP3 audio</p>

        <form id="converterForm">
            <div class="form-group">
                <label for="textInput">Enter Text to Convert:</label>
                <textarea id="textInput" placeholder="Type or paste your text here..." required></textarea>
                <div class="char-count">
                    <span id="charCount">0</span> characters
                </div>
            </div>

            <div class="button-group">
                <button type="submit" class="convert-btn" id="convertBtn">Convert to MP3</button>
                <button type="button" class="clear-btn" id="clearBtn">Clear</button>
            </div>
        </form>

        <div class="error" id="errorMessage"></div>
        <div class="success" id="successMessage"></div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Converting text to audio...</p>
        </div>

        <div class="result-section" id="resultSection">
            <h3>Your Audio File</h3>
            <div class="audio-player">
                <audio id="audioPlayer" controls>
                    Your browser does not support the audio element.
                </audio>
                <p class="player-info">✓ Audio file ready to play or download</p>
            </div>
            <button type="button" class="download-btn" id="downloadBtn">⬇️ Download MP3</button>
        </div>
    </div>

    <script>
        const form = document.getElementById('converterForm');
        const textInput = document.getElementById('textInput');
        const convertBtn = document.getElementById('convertBtn');
        const clearBtn = document.getElementById('clearBtn');
        const charCount = document.getElementById('charCount');
        const loading = document.getElementById('loading');
        const resultSection = document.getElementById('resultSection');
        const audioPlayer = document.getElementById('audioPlayer');
        const downloadBtn = document.getElementById('downloadBtn');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');

        let currentAudioUrl = '';
        let currentFilename = '';

        // Update character count
        textInput.addEventListener('input', () => {
            charCount.textContent = textInput.value.length;
        });

        // Clear form
        clearBtn.addEventListener('click', () => {
            textInput.value = '';
            charCount.textContent = '0';
            resultSection.classList.remove('show');
            audioPlayer.src = '';
            errorMessage.classList.remove('show');
            successMessage.classList.remove('show');
        });

        // Convert text to MP3
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const text = textInput.value.trim();
            if (!text) {
                showError('Please enter some text to convert');
                return;
            }

            convertBtn.disabled = true;
            loading.style.display = 'block';
            errorMessage.classList.remove('show');
            successMessage.classList.remove('show');

            try {
                const response = await fetch('/api/convert', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ text })
                });

                if (!response.ok) {
                    const data = await response.json();
                    throw new Error(data.error || 'Conversion failed');
                }

                const data = await response.json();
                currentAudioUrl = data.url;
                currentFilename = data.filename;

                audioPlayer.src = currentAudioUrl;
                resultSection.classList.add('show');
                showSuccess('Text converted to audio successfully!');
            } catch (error) {
                showError(error.message);
            } finally {
                convertBtn.disabled = false;
                loading.style.display = 'none';
            }
        });

        // Download audio file
        downloadBtn.addEventListener('click', () => {
            const link = document.createElement('a');
            link.href = currentAudioUrl;
            link.download = `text-to-speech-${Date.now()}.mp3`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });

        // Show error message
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
        }

        // Show success message
        function showSuccess(message) {
            successMessage.textContent = message;
            successMessage.classList.add('show');
        }
    </script>
</body>
</html>
